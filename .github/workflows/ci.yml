name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_secrets.sh --commits all scans every commit message

      - name: Install ffmpeg and chromaprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          ffmpeg -version | head -1
          fpcalc -version

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: |
          uv run mypy skua
          uv run mypy scripts

      - name: Pytest
        env:
          # libx264 comes with the apt ffmpeg; a skipped h264 group fails the run here.
          SKUA_REQUIRE_H264: "1"
        run: uv run pytest

      - name: Check secrets
        run: scripts/check_secrets.sh --commits all

      - name: Check imports
        run: scripts/check_imports.sh

      - name: Checkers fail on violations
        run: scripts/selftest_checks.sh
