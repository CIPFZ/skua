name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # check_secrets.sh --commits all scans every commit message

      - name: Install ffmpeg and chromaprint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libchromaprint-tools
          ffmpeg -version | head -1
          fpcalc -version

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Sync
        run: uv sync --locked

      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy
        run: |
          uv run mypy skua
          uv run mypy scripts

      - name: Pytest
        env:
          # libx264 comes with the apt ffmpeg; a skipped h264 group fails the run here.
          SKUA_REQUIRE_H264: "1"
        run: uv run pytest --junitxml=pytest.xml

      - name: Report failed tests as annotations
        # Annotations are rendered on the public run page; logs need a signed-in account.
        if: failure()
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          if not Path("pytest.xml").exists():
              raise SystemExit(0)
          for case in ET.parse("pytest.xml").iter("testcase"):
              for bad in [*case.findall("failure"), *case.findall("error")]:
                  name = f"{case.get('classname')}::{case.get('name')}"
                  text = (bad.get("message") or "") + "\n" + (bad.text or "")[-1500:]
                  text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
          PY

      - name: H.264 group executed (not skipped)
        env:
          SKUA_REQUIRE_H264: "1"
        run: |
          uv run pytest -m h264 -q --junitxml=h264.xml
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import sys
          import xml.etree.ElementTree as ET
          s = ET.parse("h264.xml").getroot().find("testsuite")
          n, skipped = int(s.get("tests")), int(s.get("skipped"))
          bad = int(s.get("failures")) + int(s.get("errors"))
          print(f"h264 group: {n} tests, {skipped} skipped, {bad} failed")
          sys.exit(0 if n > 0 and skipped == 0 and bad == 0 else 1)
          PY

      - name: Check secrets
        run: scripts/check_secrets.sh --commits all

      - name: Check imports
        run: scripts/check_imports.sh

      - name: Checkers fail on violations
        run: scripts/selftest_checks.sh
